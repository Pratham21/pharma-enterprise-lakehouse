# Declarative Automation Bundle: requires a configured Databricks workspace + UC.
# Before use: choose a supported DBR version / node type under your cluster policy.
bundle:
  name: pharma-enterprise-lakehouse

variables:
  catalog:
    description: Existing Unity Catalog catalog for this demo
    default: main

resources:
  jobs:
    pharma_pipeline:
      name: pharma-lakehouse-synthetic-demo
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: batch_number
          default: '1'
      job_clusters:
        - job_cluster_key: pharma_job_cluster
          new_cluster:
            spark_version: 16.4.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 2
            data_security_mode: SINGLE_USER
      tasks:
        - task_key: setup
          job_cluster_key: pharma_job_cluster
          notebook_task:
            notebook_path: ./notebooks/00_setup.py
        - task_key: generate_source
          depends_on:
            - task_key: setup
          job_cluster_key: pharma_job_cluster
          notebook_task:
            notebook_path: ./notebooks/01_generate_source.py
        - task_key: bronze
          depends_on:
            - task_key: generate_source
          job_cluster_key: pharma_job_cluster
          notebook_task:
            notebook_path: ./notebooks/02_bronze_autoloader.py
        - task_key: silver
          depends_on:
            - task_key: bronze
          job_cluster_key: pharma_job_cluster
          notebook_task:
            notebook_path: ./notebooks/03_silver_cdc.py
        - task_key: gold
          depends_on:
            - task_key: silver
          job_cluster_key: pharma_job_cluster
          notebook_task:
            notebook_path: ./notebooks/04_gold_marts.py
        - task_key: validate
          depends_on:
            - task_key: gold
          job_cluster_key: pharma_job_cluster
          notebook_task:
            notebook_path: ./notebooks/05_validate.py

targets:
  dev:
    default: true
    mode: development
