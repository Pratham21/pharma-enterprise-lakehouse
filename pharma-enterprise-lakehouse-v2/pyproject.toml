[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pharma-enterprise-lakehouse-demo"
version = "2.0.0"
description = "Synthetic pharma lakehouse: PySpark incremental CDC, Delta MERGE, SCD Type 2, skew performance lab"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
spark = ["pyspark>=4.0,<4.1", "delta-spark>=4.0,<4.1"]
